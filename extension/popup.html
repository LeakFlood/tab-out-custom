<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <span class="popup-kicker">Tab Out</span>
      <h1 id="popupTitle">Tab Out</h1>
    </header>

    <nav class="popup-tabs" aria-label="Tab Out">
      <button type="button" class="popup-tab" id="popupMailTab" data-popup-view="mail" aria-controls="popupPanelMail">Mail</button>
      <button type="button" class="popup-tab" id="popupCurrentTab" data-popup-view="current" aria-controls="popupPanelCurrent">Current tab</button>
    </nav>

    <p id="popupFeedback" class="popup-message" role="status" hidden></p>

    <section class="popup-panel" id="popupPanelMail" data-popup-panel="mail" hidden>
      <div class="mail-popup-toolbar">
        <strong id="mailPopupHeading">Gmail</strong>
        <button type="button" class="mail-toolbar-button" id="mailRefreshAllBtn">Refresh</button>
      </div>
      <div id="mailPopupState" class="mail-popup-state" role="status"></div>
      <div id="mailPopupAccounts" class="mail-popup-accounts"></div>
    </section>

    <section class="popup-panel" id="popupPanelCurrent" data-popup-panel="current" hidden>
      <section id="activeTabCard" class="active-tab-card" aria-live="polite">
        <div id="activeTabFavicon" class="active-tab-favicon">◎</div>
        <div class="active-tab-copy">
          <strong id="activeTabTitle"></strong>
          <span id="activeTabUrl"></span>
        </div>
      </section>

      <p id="popupUnsupported" class="popup-message is-error" hidden></p>

      <label class="popup-search">
        <span class="sr-only" id="popupSearchLabel">Search</span>
        <input id="popupSearchInput" type="search" autocomplete="off" placeholder="Search sessions…">
      </label>

      <div id="popupDestinations" class="popup-destinations">
        <section class="destination-section">
          <div class="destination-heading">
            <h2 id="sessionsHeading">Sessions</h2>
            <span id="sessionsCount"></span>
          </div>
          <div id="sessionDestinations" class="destination-list"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
